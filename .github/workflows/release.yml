name: Release

# Push a tag like `v2.1.0` → GitHub builds CliptoPulse.app and attaches CliptoPulse-v2.1.0.zip to a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish CliptoPulse.app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Build app bundle (ad-hoc signed)
        run: ./Scripts/build-app.sh

      - name: Self-test
        run: ./dist/CliptoPulse.app/Contents/MacOS/PulseBoard --self-test

      - name: Package zip
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="manual-$(date +%Y%m%d-%H%M)"
          ZIP="CliptoPulse-${TAG}.zip"
          ditto -c -k --keepParent dist/CliptoPulse.app "dist/${ZIP}"
          echo "zip=dist/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CliptoPulse-${{ steps.pkg.outputs.tag }}
          path: ${{ steps.pkg.outputs.zip }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true
          body: |
            ## 安装
            1. 下载 `CliptoPulse-${{ steps.pkg.outputs.tag }}.zip`，解压后把 `CliptoPulse.app` 拖到「应用程序」。
            2. 本版本未经 Apple 公证，首次打开会被拦截，在终端执行一次：
               ```bash
               xattr -dr com.apple.quarantine /Applications/CliptoPulse.app
               ```
               然后正常双击打开（也可以右键 →「打开」）。
            3. 启动后常驻菜单栏，网页控制台：http://127.0.0.1:8766
